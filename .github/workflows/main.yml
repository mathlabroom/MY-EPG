name: EPG Merger
on:
  schedule:
    # 每天北京时间 07:40, 13:40, 19:40, 01:40 运行
    - cron: '40 23,5,11,17 * * *'
  workflow_dispatch:

# 同时保留写入仓库和部署 Pages 的权限
permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run Merge
        run: |
          pip install requests
          python merge.py
          ls -l

      # 1. 核心修正：先把新生成的文件和时间戳强制推送到 main 分支（保活）
      - name: Committing the new data and keep alive
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          
          date > keep_alive.txt
          
          # 将生成的文件加入暂存区（这里加上你实际生成的 xml/gz 文件）
          git add -A
          
          if ! git diff --cached --quiet; then
            git commit -m "自动更新 EPG 及活跃状态: $(date)"
            git push origin main
          else
            echo "没有检测到文件变化，跳过本次提交。"
          fi

      # 2. 将当前目录打包为 Pages 产物
      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # 3. 正式部署到 GitHub Pages
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
