name: EPG Merger
on:
  schedule:
    # 每天北京时间 07:40, 13:40, 19:40, 01:40 运行
    - cron: '40 23,5,11,17 * * *'
  workflow_dispatch:

# 提升权限，允许 Action 往你的仓库里提交代码 (Push)
permissions:
  contents: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run Merge
        run: |
          pip install requests
          python merge.py
          ls -l

      # 核心修正：把新生成的文件和时间戳强制推送到 main 分支
      - name: Committing the new data and keep alive
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          
          # 创建或更新一个活跃证明文件，让 GitHub 看到每天都有代码变更
          date > keep_alive.txt
          
          # 将所有生成的文件加入暂存区
          git add guide.xml guide.xml.gz keep_alive.txt
          
          # 检查是否有文件变化，有则提交并推送
          if ! git diff --cached --quiet; then
            git commit -m "自动更新 EPG 及活跃状态: $(date)"
            git push origin main
          else
            echo "没有检测到文件变化，跳过本次提交。"
          fi
